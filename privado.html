<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zona Privada - Soria Inimaginable</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    #login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
    input { display: block; margin: 10px auto; padding: 10px; width: 220px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 20px; background-color: #2ea44f; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #2c974b; }
    #contenido-privado { display: none; max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
    img { max-width: 100%; border-radius: 8px; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- 1. PANTALLA DE USUARIO Y CONTRASEÑA -->
  <div id="login-box">
    <h2>Acceso Privado</h2>
    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="clave" placeholder="Contraseña">
    <button onclick="verificarAcceso()">Entrar</button>
    <p id="mensaje-error" style="color: red; display: none;">Usuario o contraseña incorrectos</p>
  </div>

  <!-- 2. CONTENIDO OCULTO (TEXTO Y FOTO) -->
  <div id="contenido-privado">
    <h1>Bienvenido a la sección exclusiva</h1>
    <p>Aquí puedes escribir todo el texto que quieras mostrar solo a quienes tengan la contraseña.</p>
    <img src="soria-inimaginable.jpg.jpeg" alt="Imagen privada">
    <br><br>
    <a href="index.html">Volver a la página principal</a>
  </div>

  <script>
    function verificarAcceso() {
      // CAMBIA AQUÍ TU USUARIO Y CONTRASEÑA
      const usuarioCorrecto = "Vadillo";
      const claveCorrecta = "pesada";

      const userIngresado = document.getElementById("usuario").value;
      const passIngresada = document.getElementById("clave").value;

      if (userIngresado === usuarioCorrecto && passIngresada === claveCorrecta) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("contenido-privado").style.display = "block";
      } else {
        document.getElementById("mensaje-error").style.display = "block";
      }
    }
  </script>

</body>
</html>
